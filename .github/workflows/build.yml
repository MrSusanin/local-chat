name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # В новых версиях Xcode компилятор Metal ставится отдельно.
      # Если он уже есть, команда ничего не сломает.
      - name: Make sure Metal toolchain is installed
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Build (without signing)
        run: |
          xcodebuild \
            -project LocalChat.xcodeproj \
            -scheme LocalChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LocalChat.app Payload/
          zip -qr LocalChat.ipa Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalChat-ipa
          path: LocalChat.ipa

      - name: Publish release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LocalChat (последняя сборка)
          make_latest: true
          files: LocalChat.ipa
